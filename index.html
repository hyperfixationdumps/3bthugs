<!DOCTYPE html>
<html lang="en" style="--s: 0.9914;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover">
<title>y2k container</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1a14;--panel:#0f2a20;--deep:#07120d;--line:#6fae88;--tab:#8fc79f;--tab2:#b4e6c1;--ink:#d6f5de;--dim:#4e8264;--glow:#8fffb8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;position:fixed;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink);
  font-family:"Pixelify Sans","VT323",monospace;font-size:18px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#12301f 0,#050505 75%)}
.shell{--u:7.8px;position:relative;flex:none;width:780px;height:624px;transform:scale(var(--s,1));transform-origin:center center;display:flex;flex-direction:column;
  background:var(--bg);border:3px solid var(--line);border-radius:10px;padding:14px 14px 0;
  box-shadow:0 0 0 3px #000a,0 0 40px #8fffb840,inset 0 0 40px #000a;overflow:hidden}
.tabs{display:flex;gap:10px;padding:0 6px;position:relative;z-index:2;margin-bottom:-3px;align-items:flex-end}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:19px;color:var(--deep);
  background:var(--tab);border:3px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:8px 4px;cursor:pointer;opacity:.62;transition:.2s;
  box-shadow:inset 0 3px 0 #fff6,inset 3px 0 0 #fff3;position:relative}
.tab::before{content:"";position:absolute;left:-3px;top:-8px;width:34%;height:8px;background:var(--tab);border:3px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0}
.tab::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(105deg,transparent 35%,#fffc 50%,transparent 65%) -150% 0/250% 100% no-repeat}
.tab:hover::after,.tab.on::after{animation:tshine 1s ease-out}
@keyframes tshine{to{background-position:150% 0}}
.tab svg{width:1.1em;height:1.1em;flex:none}
.tab:hover{opacity:.9}
.tab.on{opacity:1;background:var(--tab2);padding-top:12px;box-shadow:inset 0 3px 0 #fff9,0 0 14px #8fffb888}
.tab.on span{border-bottom:2px solid var(--deep);padding-bottom:1px}
.panel{flex:1;min-height:0;display:flex;align-items:center;gap:8px;padding:14px 10px;background:var(--panel);border:3px solid var(--line);border-radius:10px;box-shadow:5px 5px 0 #000,inset 0 0 22px #0008}
.stage{flex:1;align-self:stretch;min-width:0;display:flex}
.arrow{width:26px;height:64px;border:0;background:var(--tab);cursor:pointer;flex:none;clip-path:polygon(0 0,100% 20%,100% 80%,0 100%);transition:.15s}
.arrow.l{clip-path:polygon(0 20%,100% 0,100% 100%,0 80%)}
.arrow:hover{background:var(--tab2);transform:scale(1.08)}
.win{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--deep);border:3px solid var(--line);box-shadow:5px 5px 0 #000,inset 0 0 18px #000}
.wbar{display:flex;justify-content:space-between;align-items:center;padding:3px 8px;background:var(--tab);color:var(--deep);border-bottom:3px solid var(--line);font-size:15px}
.wbar b{width:20px;height:20px;border:2px solid var(--deep);display:grid;place-items:center;font-weight:400;background:var(--tab2);color:var(--deep);font-size:15px;cursor:pointer;box-shadow:2px 2px 0 var(--deep)}
.wc{display:flex;gap:6px}
.wc .mn::before{content:"";width:9px;height:3px;background:var(--deep);margin-top:8px}
.wc .mx::before{content:"";width:9px;height:9px;border:2px solid var(--deep)}
.body{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column}
.crumb{color:var(--dim);margin-bottom:10px}
.empty{flex:1;min-height:calc(var(--u)*110);border:2px dashed var(--dim);display:grid;place-items:center;color:var(--dim);text-align:center}
.folders{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 10px;padding-top:12px}
.folder{font:inherit;color:var(--ink);background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.folder .f{position:relative;width:min(78px,100%);aspect-ratio:4/3;background:var(--tab);border:3px solid var(--line);border-radius:3px 8px 4px 4px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--line),3px 3px 0 #000;transition:.15s}
.folder .f::before{content:"";position:absolute;left:-3px;top:-11px;width:38%;height:11px;background:var(--tab);border:3px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0}
.folder:hover .f{background:var(--tab2);transform:translateY(-3px)}
/* home: pixel icons on the sides, centre left empty */
.home{position:relative;flex:1;min-width:0;overflow-x:hidden;overflow-y:auto}
.inner{position:relative;min-height:calc(var(--u)*125);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2);padding-top:calc(var(--u)*2.5);background:linear-gradient(rgba(143,199,159,.12) 2px,transparent 2px) 0 0/calc(var(--u)*5) calc(var(--u)*5),linear-gradient(90deg,rgba(143,199,159,.12) 2px,transparent 2px) 0 0/calc(var(--u)*5) calc(var(--u)*5)}
.panel{position:relative;overflow:clip;transition:background .3s}
.panel>.stage{position:relative;z-index:1}
.panel>.arrow{position:relative;z-index:1}
.bgs{position:absolute;inset:0;overflow:hidden;pointer-events:none;background-repeat:repeat-y}
.st{filter:drop-shadow(1px 0 0 #8fc79f) drop-shadow(-1px 0 0 #8fc79f) drop-shadow(0 1px 0 #8fc79f) drop-shadow(0 -1px 0 #8fc79f)}
.bg{position:absolute;height:auto}
.chrome{display:grid;max-width:94%;font-family:"Pixelify Sans","VT323",monospace;font-weight:700;font-size:calc(var(--u)*3.6);letter-spacing:.02em;line-height:1.2;text-align:center;text-wrap:balance;cursor:pointer;z-index:2}
.chrome span{grid-area:1/1;user-select:none}
.chrome .tx{color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:1px 1px 0 #000,2px 2px 0 #000,3px 3px 0 #000,4px 4px 0 #000,5px 5px 0 #000,0 0 14px #ffffff55}
.chrome .ir{background:linear-gradient(100deg,#fff,#ffcdee,#d6c4ff,#bfe8ff,#c9ffe6,#fff6b8,#fff,#ffcdee);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;opacity:0;transition:opacity .25s;animation:irid 2.4s linear infinite;filter:drop-shadow(0 0 6px #c9a8ffaa)}
.chrome:hover .ir,.chrome:active .ir{opacity:1}
.chrome.pop{animation:pop .5s}
.chrome.pop .ir{opacity:1;animation-duration:.6s;filter:saturate(1.8) drop-shadow(0 0 12px #fff)}
@keyframes irid{to{background-position:300% 0}}
@keyframes pop{40%{transform:scale(1.06)}}
.cols{position:relative;z-index:1;flex:1;width:100%;min-height:0;display:flex;align-items:flex-start;justify-content:space-between;padding:0 calc(var(--u)*2.5)}
.side{display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:calc(var(--u)*3) 0;height:calc(var(--u)*52)}
.mid{flex:1}
.ic{all:unset;display:block;cursor:pointer;filter:drop-shadow(4px 4px 0 #000);transition:transform .15s,filter .2s}
.ic svg{display:block;shape-rendering:crispEdges;overflow:visible}
.ic:hover{transform:translateY(-2px);filter:drop-shadow(4px 4px 0 #000) drop-shadow(0 0 6px #d6c4ff) drop-shadow(0 0 3px #fff)}
.ic:active{transform:scale(.9)}
.ic svg{transition:transform .5s}
.flipped svg{transform:rotate(180deg)}
.a-spin svg{animation:spin1 .7s}
.a-shake svg{animation:shk .45s}
@keyframes spin1{50%{transform:rotate(180deg) scale(1.25)}100%{transform:rotate(360deg)}}
@keyframes shk{20%{transform:translateX(-4px) rotate(-6deg)}40%{transform:translateX(4px) rotate(6deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.rds{display:flex;flex-direction:column;gap:calc(var(--u)*1.3);filter:drop-shadow(2px 2px 0 #000)}
.rd{all:unset;cursor:pointer;display:block;position:relative;width:calc(var(--u)*2.6);height:calc(var(--u)*2.6);border:3px solid var(--line);border-radius:50%;background:var(--deep)}
.rd.on::after{content:"";position:absolute;inset:22%;border-radius:50%;background:var(--tab2)}
.a-beat svg{animation:beat .6s}
@keyframes beat{30%{transform:scale(1.35)}60%{transform:scale(.9)}}
.mw{width:calc(var(--u)*17);background:#eef9f1;border:2px solid #0b1a14;box-shadow:4px 4px 0 #000;color:#0b1a14;font-size:calc(var(--u)*1.7);line-height:1.2}
.mt{display:flex;justify-content:space-between;align-items:center;padding:2px 5px;background:var(--tab);border-bottom:2px solid #0b1a14}
.mt i{display:flex;gap:3px}
.mt b{width:calc(var(--u)*1.5);height:calc(var(--u)*1.5);border:2px solid #0b1a14;background:#eef9f1}
.mb{display:flex;flex-direction:column;gap:calc(var(--u)*.8);padding:calc(var(--u)*1.2) calc(var(--u)*1.5)}
.rw{all:unset;cursor:pointer;display:flex;align-items:center;gap:calc(var(--u)*1)}
.rw u{display:block;flex:none;width:calc(var(--u)*1.8);height:calc(var(--u)*1.8);border:2px solid #0b1a14;border-radius:50%;background:#fff;position:relative}
.rw.on u::after{content:"";position:absolute;inset:2px;background:#0b1a14;border-radius:50%}
.okb{all:unset;cursor:pointer;align-self:center;padding:1px calc(var(--u)*3);border:2px solid #0b1a14;box-shadow:2px 2px 0 #000;background:#eef9f1;margin-top:2px}
.okb:active{transform:translate(2px,2px);box-shadow:none}
.home::-webkit-scrollbar,.body::-webkit-scrollbar{width:12px}
.home::-webkit-scrollbar-track,.body::-webkit-scrollbar-track{background:var(--deep);border-left:2px solid var(--dim)}
.home::-webkit-scrollbar-thumb,.body::-webkit-scrollbar-thumb{background:var(--tab);border:2px solid var(--line);border-radius:0}
@supports not selector(::-webkit-scrollbar){.home,.body{scrollbar-color:var(--tab) var(--deep)}}
@media (max-width:0px){.opt{display:none!important}.tab{font-size:11px;gap:0;padding-left:1px;padding-right:1px}}
.tw{position:absolute;color:#fff;text-shadow:0 0 8px var(--glow),0 0 14px #fff;animation:tw 2.4s ease-in-out infinite;pointer-events:none}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}
.sig{display:flex;align-items:center;gap:8px;padding:2px 14px 6px;font-family:"Pixelify Sans",monospace;font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--ink)}
.sg{margin-left:auto;letter-spacing:.1em;background:linear-gradient(180deg,#fff,#a8c9b4 55%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.edb{all:unset;cursor:pointer;padding:0 6px;border:2px solid var(--line);color:var(--tab2);font-size:12px;background:var(--panel);box-shadow:2px 2px 0 #000;white-space:nowrap}
.edb:active{transform:translate(2px,2px);box-shadow:none}
.edt{display:flex;gap:6px;align-items:center;flex:1;min-width:0}.edt[hidden]{display:none}
#eurl{flex:1;min-width:0;font:inherit;font-size:12px;background:var(--deep);color:var(--ink);border:2px solid var(--line);padding:0 4px}
#ero{font-size:11px;color:var(--tab);white-space:nowrap}
.spark{position:fixed;pointer-events:none;z-index:99;color:#fff;text-shadow:0 0 6px var(--glow),0 0 12px #fff;animation:sp .7s ease-out forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) rotate(180deg) scale(.2);opacity:0}}
@media (max-width:0px){.folders{grid-template-columns:repeat(2,1fr)}}

/* Animated Y2K bling frame */
.shell{isolation:isolate}

/* Y2K glitter: black underlayer + continuously shifting jewel-like flecks */
.bling-frame{position:absolute;inset:0;border-radius:7px;z-index:30;pointer-events:none;overflow:hidden}
.bling-frame:before{
  content:"";position:absolute;inset:0;border:8px solid transparent;border-radius:7px;
  background:
    radial-gradient(ellipse at 18% 22%,#f4fff9 0 1px,transparent 2px),
    radial-gradient(ellipse at 68% 72%,#b4e6c1 0 1.2px,transparent 2.4px),
    radial-gradient(ellipse at 42% 58%,#6fae88 0 1px,transparent 2px),
    radial-gradient(ellipse at 84% 18%,#eaffef 0 1.5px,transparent 2.5px),
    repeating-conic-gradient(from 0deg at 50% 50%,#0b0d0c 0 8deg,#153c2a 9deg 12deg,#8fc79f 13deg 14deg,#080b09 15deg 22deg);
  background-size:37px 31px,49px 43px,29px 41px,61px 47px,100% 100%;
  background-position:0 0,13px 7px,5px 19px,23px 11px,0 0;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:glitterFlow 2.8s steps(8,end) infinite,glitterFlash 1.25s ease-in-out infinite alternate;
  filter:drop-shadow(0 0 3px #8fffb8aa)
}
.bling-frame:after{
  content:"";position:absolute;inset:0;border:8px solid transparent;border-radius:7px;opacity:.95;
  background:
    radial-gradient(circle,#fff 0 1px,transparent 1.8px) 0 0/23px 19px,
    radial-gradient(circle,#d6f5de 0 1px,transparent 2px) 9px 7px/31px 27px,
    radial-gradient(circle,#4e8264 0 1.5px,transparent 2.5px) 4px 11px/17px 23px;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:glitterDrift 4s linear infinite,glitterBlink 1.1s steps(2,end) infinite;
}
.bling-frame i{position:absolute;color:#f3fff7;font-style:normal;font-size:13px;line-height:1;text-shadow:0 0 4px #8fffb8,0 0 10px #d6f5de;animation:blingPulse 1.35s ease-in-out infinite}
.bling-frame i:nth-child(1){top:2px;left:14%;animation-delay:-.4s}
.bling-frame i:nth-child(2){top:2px;right:19%;font-size:10px;animation-delay:-1.1s}
.bling-frame i:nth-child(3){bottom:2px;left:67%;animation-delay:-.8s}
.bling-frame i:nth-child(4){bottom:2px;right:8%;font-size:10px;animation-delay:-1.5s}
@keyframes glitterFlow{to{background-position:37px 31px,62px 50px,34px 60px,84px 58px,0 0}}
@keyframes glitterDrift{to{background-position:23px 19px,40px 34px,21px 30px}}
@keyframes glitterFlash{0%{filter:brightness(.72) contrast(1.15) drop-shadow(0 0 2px #8fffb866)}100%{filter:brightness(1.45) contrast(1.3) drop-shadow(0 0 7px #b4e6c1)}}
@keyframes glitterBlink{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blingPulse{0%,100%{opacity:.3;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.35) rotate(45deg)}}
/* Content arrangement and text controls */
.edit-tools{display:flex;align-items:center;gap:5px;min-width:0}
.edit-tools[hidden]{display:none}
.edb:disabled{opacity:.35;cursor:not-allowed}
.body{position:relative}
.edit-layer{position:absolute;inset:0;z-index:8;pointer-events:none}
.editable-item{position:absolute;box-sizing:border-box;overflow:visible;border:0;pointer-events:auto;background:none}
.editable-item>img,.editable-item>video,.editable-item>iframe,.editable-item>audio{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;border:0;background:none;filter:drop-shadow(3px 3px 0 #000)}
.editable-item iframe{pointer-events:auto}
.editing .editable-item{cursor:move;touch-action:none}
.editing .editable-item.selected{outline:2px dashed var(--tab2);outline-offset:2px}
.editable-item .shield{display:none;position:absolute;inset:0;z-index:3}
.editing .editable-item .shield{display:block}
.editable-item .item-resize{display:none;position:absolute;right:-9px;bottom:-9px;z-index:6;width:22px;height:22px;background:var(--tab2);border:2px solid var(--deep);cursor:nwse-resize;touch-action:none}
.editing .editable-item.selected .item-resize{display:block}
.item-lock{all:unset;display:none;position:absolute;left:5px;bottom:5px;z-index:6;cursor:pointer;padding:1px 7px;font:600 11px "Pixelify Sans",monospace;background:var(--panel);color:var(--tab2);border:2px solid var(--line);box-shadow:2px 2px 0 #000;white-space:nowrap}
.editing .editable-item.selected .item-lock{display:block}
.editable-item .text-content{position:relative;width:100%;height:auto;min-height:1em;overflow:visible;padding:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.12}
.editing .editable-item.selected .text-content{cursor:move}
.add-modal{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:18px;background:#020906d9;backdrop-filter:blur(5px)}
.add-modal[hidden]{display:none}
.add-card{width:min(420px,94vw);display:flex;flex-direction:column;gap:11px;padding:16px;background:var(--panel);color:var(--ink);border:2px solid var(--tab2);box-shadow:0 0 0 3px #07120d,0 0 24px #8fffb866;font-family:inherit}
.add-head{display:flex;align-items:center;justify-content:space-between;color:var(--tab2);font-size:18px}
.add-card textarea,.add-card input,.add-card select{width:100%;min-width:0;padding:8px;background:var(--deep);color:var(--ink);border:2px solid var(--line);font:inherit;font-size:13px}
.add-card textarea{min-height:90px;resize:vertical}
.text-settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
.text-settings label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--tab2)}
.add-card .edb{padding:7px 10px;font-size:13px}
.add-card .add-note{min-height:14px;color:var(--tab2);font-size:11px}
@media(prefers-reduced-motion:reduce){.bling-frame:before,.bling-frame:after,.bling-frame i{animation:none}}
#dock{display:flex;align-items:center;gap:5px;margin-right:auto;min-width:0}
#dock .edb.on{background:var(--tab2);color:var(--deep)}
.editable-item .text-content{text-shadow:2px 2px 0 #000}
.editing .editable-item{outline:1px dashed #8fc79f99;outline-offset:2px}
.editable-item .item-resize{width:26px;height:26px;right:-13px;bottom:-13px}
@media(pointer:coarse){.editable-item .item-resize{width:36px;height:36px;right:-18px;bottom:-18px}}
.editable-item.txt .item-resize{top:-13px;bottom:auto;cursor:ew-resize}
@media(pointer:coarse){.editable-item.txt .item-resize{top:-18px;bottom:auto}}
.add-tabs{display:flex;gap:6px}.add-tabs .edb.on{background:var(--tab2);color:var(--deep)}
.add-sec{display:flex;flex-direction:column;gap:11px}
.add-card .lbl{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--tab2)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="shell">
  <div class="bling-frame" aria-hidden="true"><i>✦</i><i>✧</i><i>✦</i><i>✧</i></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="panel">
    <button class="arrow l" id="prev" aria-label="previous"></button>
    <div class="stage" id="stage"></div>
    <button class="arrow" id="next" aria-label="next"></button>
  </div>
  <div class="sig">
    <div id="dock" aria-label="site controls"></div>
    <span class="sg">✦ hafsa umer 2026 ✦</span>
  </div>
  <section class="add-modal" id="addModal" role="dialog" aria-modal="true" aria-labelledby="addTitle" hidden="">
    <div class="add-card">
      <div class="add-head"><strong id="addTitle">ADD</strong><button class="edb" id="closeAdd" aria-label="Close">✕</button></div>
      <div class="add-tabs" id="addTabs"><button class="edb on" data-tab="text">Text</button><button class="edb" data-tab="media">Media / file</button></div>
      <div id="secText" class="add-sec">
        <textarea id="contentText" placeholder="Write something for your page…"></textarea>
        <div class="text-settings">
          <label>Font
            <select id="textFont"><option value="pixel">Hafsa's Unhinged</option><option value="basic">Simple / basic (Arial)</option></select>
          </label>
          <label>Text size (px)<input id="textSize" type="number" min="8" max="160" value="24"></label>
          <label>Text colour<input id="textColor" type="color" value="#d6f5de"></label>
        </div>
        <button class="edb" id="saveText">＋ add text</button>
      </div>
      <div id="secMedia" class="add-sec" hidden="">
        <label class="lbl">Paste a link: image, GIF, video, audio (mp3), PDF, YouTube, Spotify…<input id="mediaUrl" type="url" placeholder="https://…/file.gif  ·  song.mp3  ·  clip.mp4"></label>
        <button class="edb" id="saveMedia">＋ add from link</button>
        <label class="lbl">…or upload from this device (stored inside the HTML, max 8 MB)<input id="mediaFile" type="file" accept="image/*,audio/*,video/*,application/pdf"></label>
      </div>
      <p class="add-note" id="addNote" aria-live="polite"></p>
    </div>
  </section>
</main>
<script>

async function buildDoc(rev){

  html.querySelector("#stage").innerHTML="";html.querySelector("#tabs").innerHTML="";
  html.querySelectorAll(".spark").forEach(x=>x.remove());
  html.querySelector("#site-data").textContent=JSON.stringify({rev,items:mediaItems}).replace(/</g,"\\u003c");
  return "<!DOCTYPE html>\n"+html.outerHTML;
}
async function exportFile(){

      const w=await h.createWritable();await w.write(doc);await w.close();touched=false;renderDock();return}
    catch(err){if(err&&err.name==="AbortError")return}

    a.href=url;a.download="index.html";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);touched=false;renderDock()}
  catch(err){alert("Download was blocked. Press “⧉ copy” instead, then paste into your index.html.")}
}

      g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.12,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+.28);
      o.connect(g).connect(ac.destination);o.start(s);o.stop(s+.3);
    });
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.setValueAtTime(4200,t+.1);o.frequency.exponentialRampToValueAtTime(6200,t+.35);
    g.gain.setValueAtTime(.04,t+.1);g.gain.exponentialRampToValueAtTime(.001,t+.4);
    o.connect(g).connect(ac.destination);o.start(t+.1);o.stop(t+.42);
  }catch(e){}
}
function glitter(x,y,n=9,r=34,size=12){
  for(let i=0;i<n;i++){
    const s=document.createElement("span");s.className="spark";s.textContent=i%2?"✦":"✧";
    s.style.left=x+"px";s.style.top=y+"px";s.style.fontSize=(size*.8+Math.random()*size)+"px";
    const a=Math.random()*6.28,d=r*.6+Math.random()*r;
    s.style.setProperty("--dx",Math.cos(a)*d+"px");s.style.setProperty("--dy",Math.sin(a)*d+"px");
    document.body.appendChild(s);setTimeout(()=>s.remove(),750);
  }
}
